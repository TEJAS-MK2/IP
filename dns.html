<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Browser-based DNS lookup tool."><link rel="icon" href="favicon.svg" type="image/svg+xml"><title>DNS Lookup — IP Tracker</title><link rel="stylesheet" href="style.css"></head><body><main class="site-shell"><header class="topbar"><a class="brand" href="./" aria-label="IP Tracker home"><span class="brand-mark" aria-hidden="true">IP</span><span>IP Tracker</span></a><button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="siteNav" aria-label="Open navigation"><span></span><span></span><span></span></button><nav class="nav" id="siteNav" aria-label="Primary"><a href="./">Lookup</a><a class="active" href="tools.html">Tools</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></nav></header><nav class="breadcrumbs" aria-label="Breadcrumb"><a href="./">Home</a><span>/</span><a href="tools.html">Tools</a><span>/</span><span>DNS</span></nav><section class="intro"><p class="kicker">DNS</p><h1>DNS lookup</h1><p class="lede">Query a hostname using Cloudflare's public DNS-over-HTTPS endpoint.</p></section><section class="card tool-panel"><form id="dnsForm" novalidate><label for="host">Hostname</label><div class="search-row"><input class="tool-input" id="host" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="example.com" required><select id="type" class="tool-select" aria-label="Record type"><option>A</option><option>AAAA</option><option>MX</option><option>TXT</option><option>CNAME</option><option>NS</option></select><button class="primary" id="dnsBtn" type="submit">Lookup →</button></div></form><pre id="out" class="tool-output" role="status" aria-live="polite">Enter a hostname to begin.</pre></section><footer><a href="tools.html">All tools</a><span>•</span><a href="privacy.html">Privacy</a></footer></main><script>const f=document.querySelector('#dnsForm'),o=document.querySelector('#out'),btn=document.querySelector('#dnsBtn'),host=document.querySelector('#host');f.addEventListener('submit',async e=>{e.preventDefault();const h=host.value.trim().replace(/^[a-z]+:\/\//i,'').split('/')[0].split('?')[0].split('#')[0].replace(/\.$/,'');const type=document.querySelector('#type').value;if(!h||!h.includes('.')||/[\s/]/.test(h)||h.length>253){o.textContent='Enter a valid hostname.';host.focus();return}btn.disabled=true;o.textContent='Looking up…';try{const r=await fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(h)}&type=${type}`,{headers:{accept:'application/dns-json'},cache:'no-store'});if(!r.ok)throw Error(`DNS request failed (${r.status}).`);const d=await r.json();if(d.Status===2)throw Error('DNS server failure.');if(d.Status===3){o.textContent='No records found (NXDOMAIN).';return}const rows=(d.Answer||[]).map(x=>`${x.name}  ${x.type}  ${x.data}`);o.textContent=rows.join('\n')||'No records found.'}catch(err){o.textContent=err.message||'Lookup failed.'}finally{btn.disabled=false}});const toggle=document.querySelector('#menuToggle'),nav=document.querySelector('#siteNav');toggle.addEventListener('click',()=>{const open=nav.classList.toggle('open');toggle.setAttribute('aria-expanded',String(open));toggle.setAttribute('aria-label',open?'Close navigation':'Open navigation')});nav.addEventListener('click',e=>{if(e.target.matches('a')){nav.classList.remove('open');toggle.setAttribute('aria-expanded','false');toggle.setAttribute('aria-label','Open navigation')}});</script></body></html>
