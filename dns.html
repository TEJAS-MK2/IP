<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.svg" type="image/svg+xml"><title>DNS Lookup — IP Tracker</title><link rel="stylesheet" href="style.css"></head><body><main class="site-shell"><header class="topbar"><a class="brand" href="./"><span class="brand-mark">IP</span><span>IP Tracker</span></a><nav class="nav"><a href="./">Lookup</a><a class="active" href="tools.html">Tools</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></nav><button class="menu-toggle" id="menuToggle" aria-label="Open navigation" aria-expanded="false"><span></span><span></span><span></span></button></header><nav class="breadcrumbs"><a href="./">Home</a><span>/</span><a href="tools.html">Tools</a><span>/</span><span>DNS</span></nav><section class="intro"><p class="kicker">DNS</p><h1>DNS lookup</h1><p class="lede">Query a hostname using Cloudflare's public DNS-over-HTTPS endpoint.</p></section><section class="card tool-panel"><form id="dnsForm"><label for="host">Hostname</label><div class="search-row"><input class="tool-input" id="host" placeholder="example.com" required><select id="type" class="tool-select" aria-label="Record type"><option>A</option><option>AAAA</option><option>MX</option><option>TXT</option><option>CNAME</option><option>NS</option></select><button class="primary" type="submit">Lookup →</button></div></form><pre id="out" class="tool-output">Enter a hostname to begin.</pre></section><footer><a href="tools.html">All tools</a><span>•</span><a href="privacy.html">Privacy</a></footer></main><script>const f=document.querySelector('#dnsForm'),o=document.querySelector('#out');f.onsubmit=async e=>{e.preventDefault();const h=document.querySelector('#host').value.trim().replace(/^https?:\/\//,'').split('/')[0],type=document.querySelector('#type').value;o.textContent='Looking up…';try{const r=await fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(h)}&type=${type}`,{headers:{accept:'application/dns-json'},cache:'no-store'});if(!r.ok)throw Error('DNS request failed.');const d=await r.json();o.textContent=(d.Answer||[]).map(x=>`${x.name}  ${x.type}  ${x.data}`).join('\n')||'No records found.'}catch(err){o.textContent=err.message||'Lookup failed.'}}</script></body></html>
