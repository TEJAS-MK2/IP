<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.svg" type="image/svg+xml"><title>RDAP Lookup — IP Tracker</title><link rel="stylesheet" href="style.css"></head><body><main class="site-shell"><header class="topbar"><a class="brand" href="./"><span class="brand-mark">IP</span><span>IP Tracker</span></a><nav class="nav"><a href="./">Lookup</a><a class="active" href="tools.html">Tools</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></nav><button class="menu-toggle" id="menuToggle" aria-label="Open navigation" aria-expanded="false"><span></span><span></span><span></span></button></header><nav class="breadcrumbs"><a href="./">Home</a><span>/</span><a href="tools.html">Tools</a><span>/</span><span>RDAP</span></nav><section class="intro"><p class="kicker">REGISTRATION DATA</p><h1>RDAP lookup</h1><p class="lede">Open public registration data for a domain or IP address through an RDAP service.</p></section><section class="card tool-panel"><label for="target">Domain or IP address</label><div class="search-row"><input class="tool-input" id="target" placeholder="example.com or 8.8.8.8"><button class="primary" id="go">Open RDAP →</button></div><p id="status" class="status"></p></section><footer><a href="tools.html">All tools</a><span>•</span><a href="privacy.html">Privacy</a></footer></main><script>const i=document.querySelector('#target'),b=document.querySelector('#go'),s=document.querySelector('#status');b.onclick=()=>{let v=i.value.trim();if(!v){s.textContent='Enter a domain or IP address.';return}if(/^https?:\/\//i.test(v))v=new URL(v).hostname;const isIp=/^[0-9a-f:.]+$/i.test(v);const url=isIp?`https://rdap.org/ip/${encodeURIComponent(v)}`:`https://rdap.org/domain/${encodeURIComponent(v)}`;window.open(url,'_blank','noopener,noreferrer')};</script></body></html>
