<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Browser-based RDAP lookup tool for domains and IP addresses."><link rel="icon" href="favicon.svg" type="image/svg+xml"><title>RDAP Lookup — IP Tracker</title><link rel="stylesheet" href="style.css"></head><body><main class="site-shell"><header class="topbar"><a class="brand" href="./" aria-label="IP Tracker home"><span class="brand-mark" aria-hidden="true">IP</span><span>IP Tracker</span></a><button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="siteNav" aria-label="Open navigation"><span></span><span></span><span></span></button><nav class="nav" id="siteNav" aria-label="Primary"><a href="./">Lookup</a><a class="active" href="tools.html">Tools</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></nav></header><nav class="breadcrumbs" aria-label="Breadcrumb"><a href="./">Home</a><span>/</span><a href="tools.html">Tools</a><span>/</span><span>RDAP</span></nav><section class="intro"><p class="kicker">REGISTRATION DATA</p><h1>RDAP lookup</h1><p class="lede">Open public registration data for a domain or IP address through an RDAP service.</p></section><section class="card tool-panel"><form id="rdapForm" novalidate><label for="target">Domain or IP address</label><div class="search-row"><input class="tool-input" id="target" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="example.com or 8.8.8.8" required><button class="primary" id="go" type="submit">Open RDAP →</button></div><p id="status" class="status" role="status" aria-live="polite"></p></form></section><footer><a href="tools.html">All tools</a><span>•</span><a href="privacy.html">Privacy</a></footer></main><script>const f=document.querySelector('#rdapForm'),i=document.querySelector('#target'),b=document.querySelector('#go'),s=document.querySelector('#status');f.addEventListener('submit',e=>{e.preventDefault();let v=i.value.trim();if(!v){s.textContent='Enter a domain or IP address.';return}try{if(/^[a-z][a-z0-9+.-]*:\/\//i.test(v))v=new URL(v).hostname;if(!v||/[\s/]/.test(v)){s.textContent='Enter a valid domain or IP address.';return}const isIp=/^[0-9a-f:.]+$/i.test(v)&&(/\./.test(v)||/:/.test(v));const url=isIp?`https://rdap.org/ip/${encodeURIComponent(v)}`:`https://rdap.org/domain/${encodeURIComponent(v)}`;window.open(url,'_blank','noopener,noreferrer');s.textContent='RDAP opened in a new tab.'}catch{s.textContent='Enter a valid domain or IP address.';i.focus()}});const toggle=document.querySelector('#menuToggle'),nav=document.querySelector('#siteNav');toggle.addEventListener('click',()=>{const open=nav.classList.toggle('open');toggle.setAttribute('aria-expanded',String(open));toggle.setAttribute('aria-label',open?'Close navigation':'Open navigation')});nav.addEventListener('click',e=>{if(e.target.matches('a')){nav.classList.remove('open');toggle.setAttribute('aria-expanded','false');toggle.setAttribute('aria-label','Open navigation')}});</script></body></html>
