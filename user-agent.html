<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Check the user-agent string exposed by your browser."><link rel="icon" href="favicon.svg" type="image/svg+xml"><title>User-Agent Checker — IP Tracker</title><link rel="stylesheet" href="style.css"></head><body><main class="site-shell"><header class="topbar"><a class="brand" href="./" aria-label="IP Tracker home"><span class="brand-mark" aria-hidden="true">IP</span><span>IP Tracker</span></a><button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="siteNav" aria-label="Open navigation"><span></span><span></span><span></span></button><nav class="nav" id="siteNav" aria-label="Primary"><a href="./">Lookup</a><a class="active" href="tools.html">Tools</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></nav></header><nav class="breadcrumbs" aria-label="Breadcrumb"><a href="./">Home</a><span>/</span><a href="tools.html">Tools</a><span>/</span><span>User-Agent</span></nav><section class="intro"><p class="kicker">HTTP</p><h1>User-Agent checker</h1><p class="lede">See the exact user-agent string exposed by your current browser.</p></section><section class="card tool-panel"><label for="ua">Your user-agent</label><textarea id="ua" readonly></textarea><button class="primary" id="copy" type="button">Copy user-agent</button><p id="status" class="status" role="status" aria-live="polite"></p></section><footer><a href="tools.html">All tools</a><span>•</span><a href="privacy.html">Privacy</a></footer></main><script>const u=document.querySelector('#ua'),b=document.querySelector('#copy'),s=document.querySelector('#status');u.value=navigator.userAgent;b.addEventListener('click',async()=>{try{if(!navigator.clipboard||!window.isSecureContext)throw Error();await navigator.clipboard.writeText(u.value);b.textContent='Copied';setTimeout(()=>b.textContent='Copy user-agent',1200)}catch{s.textContent='Copy failed; select the text manually.'}});const toggle=document.querySelector('#menuToggle'),nav=document.querySelector('#siteNav');toggle.addEventListener('click',()=>{const open=nav.classList.toggle('open');toggle.setAttribute('aria-expanded',String(open));toggle.setAttribute('aria-label',open?'Close navigation':'Open navigation')});nav.addEventListener('click',e=>{if(e.target.matches('a')){nav.classList.remove('open');toggle.setAttribute('aria-expanded','false');toggle.setAttribute('aria-label','Open navigation')}});</script></body></html>
